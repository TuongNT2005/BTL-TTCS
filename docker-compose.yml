services:
  mysqldb:
    build:
      context: ./csdl
      dockerfile: Dockerfile 
    image: clothing_shop_db  
    container_name: clothing_shop_db
    command: --lower_case_table_names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=clothing_shop
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clothing_shop_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend-app:
    build: 
      context: ./back-end/shop
      dockerfile: Dockerfile
    image: clothing_shop_backend  
    container_name: clothing_shop_be
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/clothing_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend-app:
    build:
      context: ./front-end/shop
      dockerfile: Dockerfile
    image: clothing_shop_frontend
    container_name: clothing_shop_fe
    ports:
      - "5173:5173"
    depends_on:
      - backend-app
    restart: unless-stopped

volumes:
  mysql_data:
  backend_uploads: