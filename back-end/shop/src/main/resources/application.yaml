spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clothing_shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:   
    hibernate:
      ddl-auto: update
    show-sql: true       # in SQL ra console để debug
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        highlight_sql: true
        format_sql: true
        generate_statistics: true
  
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

app:   
  jwt:
    secretKey: 9c11b8604371672aac f9888b5e023f bc7c0edbadb7b6e0e5 112917cf1ca926

logging:
  level:
    org.hibernate.stat: DEBUG
    org.hibernate.SQL: DEBUG
